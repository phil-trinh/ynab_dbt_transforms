version: 2

sources:
  - name: raw
    description: "Raw YNAB budget data from YNAB API."
    loader: airbyte
    tags: [raw]
    tables:
      - name: transactions
        description: "Transactions data for main budget in YNAB."
        columns:
          - name: id
            description: "Primary key"
            data_type: text
            tests:
              - unique
              - not_null
          - name: amount
            description: "Transaction amount (in cents)"
            data_type: float8
            tests:
              - not_null
          - name: date
            description: "Date of transaction"
            data_type: date
            tests:
              - not_null
          - name: account_name
            description: "Account associated with transaction"
            data_type: text
            tests:
              - not_null
          - name: category_name
            description: "Transaction category name"
            data_type: text
            tests:
              - not_null
        freshness:
          warn_after:
            count: 7
            period: day
          # error_after:
          #   count: <positive_integer>
          #   period: minute | hour | day
          # filter: <boolean_sql_expression>
        loaded_at_field: _airbyte_emitted_at

      - name: subtransactions
        identifier: transactions_subtransactions
        description: "Sub-transactions data for main budget in YNAB for transactions that have been split."
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: amount
            description: "Transaction amount (in cents)"
            tests:
              - not_null
          - name: category_name
            description: "Transaction category name"
            tests:
              - not_null

      - name: accounts
        identifier: accounts
        description: "Information on accounts tied to 'Parallel Life' budget in YNAB."
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: type
            description: "Account type category"
            tests:
              - not_null
          - name: balance
            description: "Total account balance"
            tests:
              - not_null
          - name: name
            description: "Account name"
            tests:
              - not_null
          - name: closed
            description: "Whether the account is closed or not"
            tests:
              - not_null

      - name: category_groups
        identifier: categories_categories
        description: "Main category groups for main budget in YNAB."
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: name
            description: "Category name"
            tests:
              - unique
              - not_null
          - name: category_group_id
            description: "ID of Category Group"
            tests:
              - not_null
          - name: category_group_name
            description: "Category Group Name"
            tests:
              - not_null

      - name: categories
        description: "Granular categories for main budget in YNAB."
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: name
            description: "Category group name"
            tests:
              - unique
              - not_null


models:
  - name: accounts_datamart
    description: "Information on accounts tied to 'Parallel Life' budget in YNAB."
    config:
      contract:
        enforced: true

    columns:
      - name: id
        data_type: text
        description: "Primary Key."
        constraints:
          - type: primary_key

      - name: name
        data_type: text
        description: "Account name."
        constraints:
          - type: unique
          - type: not_null

      - name: type
        data_type: text
        description: "Account Type according to YNAB."
        constraints:
          - type: not_null

      - name: balance
        data_type: float8
        description: "Total account balance."
        constraints:
          - type: not_null

      - name: uncleared_balance
        data_type: float8
        description: "Balance of uncleared transactions in the account."
        constraints:
          - type: not_null

      - name: cleared_balance
        data_type: float8
        description: "Balance of cleared transactions in the account."
        constraints:
          - type: not_null

      - name: note
        data_type: text
        description: "Extra note tied to account."

      - name: deleted
        data_type: boolean
        description: "Account is deleted from the budget."
        constraints:
          - type: not_null

      - name: closed
        data_type: boolean
        description: "Account is closed in the budget."
        constraints:
          - type: not_null

      - name: on_budget
        data_type: boolean
        description: "Not sure what this is O_o."
        constraints:
          - type: not_null

      - name: last_reconciled_at
        data_type: timestamp with time zone
        description: "Last timestamp the account got reconciled at."

      - name: transfer_payee_id
        data_type: text
        description: "Payee ID for account that's used for transfer transactions between accounts."
        constraints:
          - type: not_null

      - name: direct_import_linked
        data_type: boolean
        description: "Denoting if account is linked to a direct import connection."
        constraints:
          - type: not_null

      - name: direct_import_in_error
        data_type: boolean
        description: "Denoting if direct import connection for account is currently erroring out."
        constraints:
          - type: not_null


  - name: spending_transactions_datamart_demo
    description: "Data model of all spending transactions for demonstration purposes. Data has been scrubbed for personal information and amounts
                  have been randomly generated based on distribution of actuals."
    config:
      contract:
        enforced: true

    columns:
      - name: id
        data_type: text
        description: "Primary Key with subtransactions having the their IDs concatenated with the original transaction ID."
        constraints:
          - type: primary_key

      - name: date
        data_type: date
        description: "Date of transaction."
        constraints:
          - type: not_null

      - name: amount
        data_type: float8
        description: "Transaction amount. Positive is spending, negative is refunds/reimbursements."
        constraints:
          - type: not_null

      - name: category_group_name
        data_type: text
        description: "Associated major category group in budget."
        constraints:
          - type: not_null

      - name: category_name
        data_type: text
        description: "Associated category in budget."
        constraints:
          - type: not_null

      - name: account_name
        data_type: text
        description: "Account the Transaction came from."
        constraints:
          - type: not_null

      - name: payee_name
        data_type: text
        description: "Transaction payee."
        constraints:
          - type: not_null


  - name: spending_transactions_datamart
    description: "Data model of all spending transactions in Phil's \"Parallel Life\" budget in YNAB."
    config:
      contract:
        enforced: true

    columns:
      - name: id
        data_type: text
        description: "Primary Key with subtransactions having the their IDs concatenated with the original transaction ID."
        constraints:
          - type: primary_key

      - name: original_transaction_id
        data_type: text
        description: "Original transaction ID if record is of a subtransaction. Otherwise, it's the same as id."
        constraints:
          - type: not_null

      - name: subtransaction_id
        data_type: text
        description: "Subtransaction ID if record is of a subtransaction. Otherwise, null."

      - name: date
        data_type: date
        description: "Date of transaction."
        constraints:
          - type: not_null

      - name: amount
        data_type: float8
        description: "Transaction amount. Positive is spending, negative is refunds/reimbursements."
        constraints:
          - type: not_null

      - name: category_group_name
        data_type: text
        description: "Associated major category group in budget."
        constraints:
          - type: not_null

      - name: category_name
        data_type: text
        description: "Associated category in budget."
        constraints:
          - type: not_null

      - name: account_name
        data_type: text
        description: "Account the Transaction came from."
        constraints:
          - type: not_null

      - name: payee_name
        data_type: text
        description: "Transaction payee."

      - name: memo
        data_type: text
        description: "Transaction comments."

      - name: transfer_transaction_id
        data_type: text
        description: "Corresponding transaction that transferred amount to/from."

      - name: matched_transaction_id
        data_type: text
        description: "Matched transaction that is the same as this transaction."

      - name: subtransaction_flag
        data_type: boolean
        description: "Matched transaction that is the same as this transaction."
        constraints:
          - type: not_null


  - name: transactions_datamart
    description: "Data model of all transactions in Phil's \"Parallel Life\" budget in YNAB."
    config:

version: 2

models:
  - name: dim_accounts
    description: "Information on accounts tied to 'Parallel Life' budget in YNAB."
    config:
      contract:
        enforced: true

    columns:
      - name: account_id
        data_type: text
        description: "Primary Key."
        constraints:
          - type: primary_key

      - name: account_name
        data_type: text
        description: "Account name."
        constraints:
          - type: unique
          - type: not_null

      - name: account_type
        data_type: text
        description: "Account Type according to YNAB."
        constraints:
          - type: not_null

      - name: balance
        data_type: float8
        description: "Total account balance."
        constraints:
          - type: not_null

      - name: uncleared_balance
        data_type: float8
        description: "Balance of uncleared transactions in the account."
        constraints:
          - type: not_null

      - name: cleared_balance
        data_type: float8
        description: "Balance of cleared transactions in the account."
        constraints:
          - type: not_null

      - name: note
        data_type: text
        description: "Extra note tied to account."

      - name: deleted
        data_type: boolean
        description: "Account is deleted from the budget."
        constraints:
          - type: not_null

      - name: closed
        data_type: boolean
        description: "Account is closed in the budget."
        constraints:
          - type: not_null

      - name: on_budget
        data_type: boolean
        description: "Whether this account is on budget or not - From YNAB, whatever this means."
        constraints:
          - type: not_null

      - name: last_reconciled_at
        data_type: timestamp with time zone
        description: "Last timestamp the account got reconciled at."

      - name: transfer_payee_id
        data_type: text
        description: "Payee ID for account that's used for transfer transactions between accounts."
        constraints:
          - type: not_null

      - name: direct_import_linked
        data_type: boolean
        description: "Denoting if account is linked to a direct import connection."
        constraints:
          - type: not_null

      - name: direct_import_in_error
        data_type: boolean
        description: "Denoting if direct import connection for account is currently erroring out."
        constraints:
          - type: not_null


  - name: spending_transactions_datamart_demo
    description: "Data model of all spending transactions for demonstration purposes. Data has been scrubbed for personal information and amounts
                  have been randomly generated based on distribution of actuals."
    config:
      contract:
        enforced: true

    columns:
      - name: id
        data_type: text
        description: "Primary Key with subtransactions having the their IDs concatenated with the original transaction ID."
        constraints:
          - type: primary_key

      - name: date
        data_type: date
        description: "Date of transaction."
        constraints:
          - type: not_null

      - name: amount
        data_type: float8
        description: "Transaction amount. Positive is spending, negative is refunds/reimbursements."
        constraints:
          - type: not_null

      - name: category_group_name
        data_type: text
        description: "Associated major category group in budget."
        constraints:
          - type: not_null

      - name: category_name
        data_type: text
        description: "Associated category in budget."
        constraints:
          - type: not_null

      - name: account_name
        data_type: text
        description: "Account the Transaction came from."
        constraints:
          - type: not_null

      - name: payee_name
        data_type: text
        description: "Transaction payee."
        constraints:
          - type: not_null


  - name: spending_transactions_datamart
    description: "Data model of all spending transactions in Phil's \"Parallel Life\" budget in YNAB."
    config:
      contract:
        enforced: true

    columns:
      - name: id
        data_type: text
        description: "Primary Key with subtransactions having the their IDs concatenated with the original transaction ID."
        constraints:
          - type: primary_key

      - name: original_transaction_id
        data_type: text
        description: "Original transaction ID if record is of a subtransaction. Otherwise, it's the same as id."
        constraints:
          - type: not_null

      - name: subtransaction_id
        data_type: text
        description: "Subtransaction ID if record is of a subtransaction. Otherwise, null."

      - name: date
        data_type: date
        description: "Date of transaction."
        constraints:
          - type: not_null

      - name: amount
        data_type: float8
        description: "Transaction amount. Positive is spending, negative is refunds/reimbursements."
        constraints:
          - type: not_null

      - name: category_group_name
        data_type: text
        description: "Associated major category group in budget."
        constraints:
          - type: not_null

      - name: category_name
        data_type: text
        description: "Associated category in budget."
        constraints:
          - type: not_null

      - name: account_name
        data_type: text
        description: "Account the Transaction came from."
        constraints:
          - type: not_null

      - name: payee_name
        data_type: text
        description: "Transaction payee."

      - name: memo
        data_type: text
        description: "Transaction comments."

      - name: transfer_transaction_id
        data_type: text
        description: "Corresponding transaction that transferred amount to/from."

      - name: matched_transaction_id
        data_type: text
        description: "Matched transaction that is the same as this transaction."

      - name: subtransaction_flag
        data_type: boolean
        description: "Matched transaction that is the same as this transaction."
        constraints:
          - type: not_null


  - name: fct_transactions
    description: "Data model of all transactions in Phil's \"Parallel Life\" budget in YNAB."
    config:
      contract:
        enforced: true

    columns:
      - name: id
        data_type: text
        description: "Primary Key with subtransactions having the their IDs concatenated with the original transaction ID."
        constraints:
          - type: primary_key

      - name: original_transaction_id
        data_type: text
        description: "Original transaction ID if record is of a subtransaction. Otherwise, it's the same as id."
        constraints:
          - type: not_null

      - name: subtransaction_id
        data_type: text
        description: "Subtransaction ID if record is of a subtransaction. Otherwise, null."

      - name: date
        data_type: date
        description: "Date of transaction."
        constraints:
          - type: not_null

      - name: amount
        data_type: float8
        description: "Transaction amount. Positive is spending, negative is refunds/reimbursements."
        constraints:
          - type: not_null

      - name: category_group_name
        data_type: text
        description: "Associated major category group in budget."

      - name: category_name
        data_type: text
        description: "Associated category in budget."
        constraints:
          - type: not_null

      - name: account_name
        data_type: text
        description: "Account the Transaction came from."
        constraints:
          - type: not_null

      - name: account_type
        data_type: text
        description: "Account type the Transaction came from."
        constraints:
          - type: not_null

      - name: payee_name
        data_type: text
        description: "Transaction payee."

      - name: memo
        data_type: text
        description: "Transaction comments."

      - name: transfer_transaction_id
        data_type: text
        description: "Corresponding transaction that transferred amount to/from."

      - name: matched_transaction_id
        data_type: text
        description: "Matched transaction that is the same as this transaction."

      - name: subtransaction_flag
        data_type: boolean
        description: "Matched transaction that is the same as this transaction."
        constraints:
          - type: not_null

      - name: transaction_type
        data_type: text
        description: "Transaction Types: Income, Expenses, or Starting Balance."
        constraints:
          - type: not_null

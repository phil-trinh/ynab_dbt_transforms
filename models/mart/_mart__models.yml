version: 2

models:
  - name: dim_accounts
    description: "Information on accounts tied to 'Parallel Life' budget in YNAB."
    config:
      contract:
        enforced: true

    columns:
      - name: account_id
        data_type: text
        description: "Primary Key."
        constraints:
          - type: primary_key

      - name: account_name
        data_type: text
        description: "Account name."
        constraints:
          - type: unique
          - type: not_null

      - name: account_type
        data_type: text
        description: "Account Type according to YNAB."
        constraints:
          - type: not_null
        tests:
        - accepted_values:
            # name: unexpected_account_types  # Airbyte dbt does not have "name" as an accepted argument
            values: ['Cash', 'Checking', 'Credit Card', 'Mortgage', 'Other Asset', 'Other Liability', 'Retirement',
              'Savings', 'Student Loan']

      - name: account_balance
        data_type: float8
        description: "Current balance of the account."
        constraints:
          - type: not_null

      - name: account_uncleared_balance
        data_type: float8
        description: "Current balance of uncleared transactions in the account."
        constraints:
          - type: not_null

      - name: account_cleared_balance
        data_type: float8
        description: "Current balance of cleared transactions in the account."
        constraints:
          - type: not_null

      - name: account_note
        data_type: text
        description: "Extra note tied to account."

      - name: is_deleted
        data_type: boolean
        description: "Account is deleted from the budget."
        constraints:
          - type: not_null

      - name: is_closed
        data_type: boolean
        description: "Account is closed in the budget."
        constraints:
          - type: not_null

      - name: is_on_budget
        data_type: boolean
        description: "Whether this account is on budget or not - From YNAB, whatever this means."
        constraints:
          - type: not_null

      - name: last_reconciled_at
        data_type: timestamp with time zone
        description: "A date/time specifying when the account was last reconciled."

      - name: transfer_payee_id
        data_type: text
        description: "The payee id which should be used when transferring to this account."
        constraints:
          - type: not_null

      - name: direct_import_linked
        data_type: boolean
        description: "Whether or not the account is linked to a financial institution for automatic transaction import."
        constraints:
          - type: not_null

      - name: direct_import_in_error
        data_type: boolean
        description: "If an account linked to a financial institution (direct_import_linked=true) and the linked
          connection is not in a healthy state, this will be true."
        constraints:
          - type: not_null


  - name: dim_categories
    description: "Information on accounts tied to 'Parallel Life' budget in YNAB."
    config:
      contract:
        enforced: true

    columns:
      - name: category_id
        data_type: text
        description: "Budget category primary key."
        constraints:
          - type: primary_key

      - name: category_name
        data_type: text
        description: "Budget category name."
        constraints:
          - type: unique
          - type: not_null

      - name: category_group_id
        data_type: text
        description: "Major category identifier."
        constraints:
          - type: not_null

      - name: category_group_name
        data_type: text
        description: "Major category name."
        constraints:
          - type: not_null

      - name: category_note
        data_type: text
        description: "Extra category notes."

      - name: category_activity
        data_type: float8
        description: "Current category activity amount. i.e. total of transaction amounts associated with category."

      - name: category_budgeted
        data_type: float8
        description: "Current category budgeted amount. i.e. total amount budgeted to this category"

      - name: category_balance
        data_type: float8
        description: "Current category balance amount. category_activity minus category_budgeted"

      - name: category_goal_type
        data_type: text
        description: "The type of goal, if the category has a goal (TB='Target Category Balance', TBD='Target Category
          Balance by Date', MF='Monthly Funding', NEED='Plan Your Spending')."
        tests:
        - accepted_values:
            # name: mart_accepted_values_category_goal_type  # Airbyte dbt does not have "name" as an accepted argument
            values: ['TB', 'TBD', 'MF', 'NEED', 'DEBT']

      - name: category_goal_target
        data_type: float8
        description: "Category goal target amount."

      - name: category_goal_cadence
        data_type: smallint
        description: '{{ doc("category_goal_cadence") }}'

      - name: category_goal_cadence_frequency
        data_type: smallint
        description: '{{ doc("category_goal_cadence_frequency") }}'

      - name: category_goal_percentage_complete
        data_type: float4
        description: "The percentage completion of the goal."

      - name: category_goal_overall_funded
        data_type: float8
        description: "The total amount funded towards the goal within the current goal period."

      - name: category_goal_overall_left
        data_type: float8
        description: "The amount of funding still needed to complete the goal within the current goal period."

      - name: category_goal_under_funded
        data_type: float8
        description: "The amount of funding still needed in the current month to stay on track towards completing the
          goal within the current goal period."

      - name: category_goal_months_to_budget
        data_type: smallint
        description: "The number of months, including the current month, left in the current goal period."

      - name: category_goal_target_month
        data_type: text
        description: "The original target month for the goal to be completed. Only some goal types specify this date."

      - name: category_goal_creation_month
        data_type: text
        description: "The month a goal was created."

      - name: is_hidden
        data_type: boolean
        description: "Whether or not the category group is hidden."
        constraints:
          - type: not_null



  - name: spending_transactions_datamart_demo
    description: "Data model of all spending transactions for demonstration purposes. Data has been scrubbed for
      personal information and amounts have been randomly generated based on distribution of actuals."
    config:
      contract:
        enforced: true

    columns:
      - name: transaction_id
        data_type: text
        description: "Primary Key with subtransactions having the their IDs concatenated with the original transaction
          ID."
        constraints:
          - type: primary_key

      - name: transaction_date
        data_type: date
        description: "Date of transaction."
        constraints:
          - type: not_null

      - name: transaction_amount
        data_type: float8
        description: "Transaction amount. Positive is spending, negative is refunds/reimbursements."
        constraints:
          - type: not_null

      - name: category_group_name
        data_type: text
        description: "Associated major category group in budget."
        constraints:
          - type: not_null

      - name: category_name
        data_type: text
        description: "Associated category in budget."
        constraints:
          - type: not_null

      - name: account_name
        data_type: text
        description: "Account the Transaction came from."
        constraints:
          - type: not_null

      - name: payee_name
        data_type: text
        description: "Transaction payee."
        constraints:
          - type: not_null


  - name: spending_transactions_datamart
    description: "Data model of all spending transactions in Phil's \"Parallel Life\" budget in YNAB."
    config:
      contract:
        enforced: true

    columns:
      - name: transaction_id
        data_type: text
        description: "Primary Key with subtransactions having the their IDs concatenated with the original transaction
          ID."
        constraints:
          - type: primary_key

      - name: original_transaction_id
        data_type: text
        description: "Original transaction ID if record is of a subtransaction. Otherwise, it's the same as id."
        constraints:
          - type: not_null

      - name: subtransaction_id
        data_type: text
        description: "Subtransaction ID if record is of a subtransaction. Otherwise, null."

      - name: transaction_date
        data_type: date
        description: "Date of transaction."
        constraints:
          - type: not_null

      - name: transaction_amount
        data_type: float8
        description: "Transaction amount. Positive is spending, negative is refunds/reimbursements."
        constraints:
          - type: not_null

      - name: category_group_name
        data_type: text
        description: "Associated major category group in budget."
        constraints:
          - type: not_null

      - name: category_name
        data_type: text
        description: "Associated category in budget."
        constraints:
          - type: not_null

      - name: account_name
        data_type: text
        description: "Account the transaction occured."
        constraints:
          - type: not_null

      - name: account_type
        data_type: text
        description: "Type of account the transaction occured."
        constraints:
          - type: not_null

      - name: payee_name
        data_type: text
        description: "Transaction payee."

      - name: transaction_memo
        data_type: text
        description: "Transaction comments."

      - name: transfer_transaction_id
        data_type: text
        description: "Corresponding transaction that transferred amount to/from."

      - name: matched_transaction_id
        data_type: text
        description: "Matched transaction that is the same as this transaction."

      - name: subtransaction_flag
        data_type: boolean
        description: "Matched transaction that is the same as this transaction."
        constraints:
          - type: not_null

      - name: transaction_type
        data_type: text
        description: "Transaction Types: Income, Expenses, or Starting Balance."
        constraints:
          - type: not_null
        tests:
        - accepted_values:
            # name: mart_accepted_values_transactions_type  # Airbyte dbt does not have "name" as an accepted argument
            values: ['Income', 'Expense', 'Mortgage Payment', 'Credit Card Payment', 'Transfer', 'Retirement Savings',
              'NA']


  - name: fct_transactions
    description: "Data model of all transactions in Phil's \"Parallel Life\" budget in YNAB."
    config:
      contract:
        enforced: true

    columns:
      - name: transaction_id
        data_type: text
        description: "Primary Key with subtransactions having the their IDs concatenated with the original transaction
          ID."
        constraints:
          - type: primary_key

      - name: original_transaction_id
        data_type: text
        description: "Original transaction ID if record is of a subtransaction. Otherwise, it's the same as id."
        constraints:
          - type: not_null

      - name: subtransaction_id
        data_type: text
        description: "Subtransaction ID if record is of a subtransaction. Otherwise, null."

      - name: transaction_date
        data_type: date
        description: "Date of transaction."
        constraints:
          - type: not_null

      - name: transaction_amount
        data_type: float8
        description: "Transaction amount. Positive is spending, negative is refunds/reimbursements."
        constraints:
          - type: not_null

      - name: category_group_name
        data_type: text
        description: "Associated major category group in budget."

      - name: category_name
        data_type: text
        description: "Associated category in budget."
        constraints:
          - type: not_null

      - name: account_name
        data_type: text
        description: "Account the transaction occured."
        constraints:
          - type: not_null

      - name: account_type
        data_type: text
        description: "Type of account the transaction occured."
        constraints:
          - type: not_null

      - name: payee_name
        data_type: text
        description: "Transaction payee."

      - name: transaction_memo
        data_type: text
        description: "Transaction comments."

      - name: transfer_account_id
        data_type: text
        description: "Account ID of transaction being transferred to."

      - name: transfer_account_name
        data_type: text
        description: "Account Name of transaction being transferred to."

      - name: transfer_account_type
        data_type: text
        description: "Account Type of transaction being transferred to."

      - name: transfer_transaction_id
        data_type: text
        description: "Corresponding transaction that transferred amount to/from."

      - name: matched_transaction_id
        data_type: text
        description: "Matched transaction that is the same as this transaction."

      - name: subtransaction_flag
        data_type: boolean
        description: "Matched transaction that is the same as this transaction."
        constraints:
          - type: not_null

      - name: transaction_type
        data_type: text
        description: "Transaction Types: Income, Expenses, or Starting Balance."
        constraints:
          - type: not_null
        tests:
        - accepted_values:
            # name: mart_accepted_values_transactions_type  # Airbyte dbt does not have "name" as an accepted argument
            values: ['Credit Card Payment', 'Expense', 'Income', 'Mortgage Payment', 'NA', 'Retirement Savings',
              'Transfer']

# This is a basic workflow to help you get started with Actions
# Reference to https://dbtips.substack.com/p/run-dbt-with-github-actions

name: CI DBT Workflow

# Controls when the workflow will run
on:
  # Triggers the workflow on pull request events 
  pull_request:
    branches: [ "production", "dev" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Setting some Env variables to work with profiles.yml
env:
  DBT_PROFILE_TARGET: default
  DB_HOST: ${{ env.DB_HOST }}
  DB_PORT: ${{ env.DB_PORT }}
  DB_USER: ${{ env.DB_USER }}
  DB_PASSWORD: ${{ env.DB_PASSWORD }}
  DEV_DB_NAME: ${{ env.DEV_DB_NAME }}
  PROD_DB_NAME: ${{ env.PROD_DB_NAME }}
  DB_SCHEMA: ${{ env.DB_SCHEMA }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  dbt_run:
    name: Continuous Integration dbt build and test
    runs-on: ubuntu-latest                            # The type of runner that the job will run on
    timeout-minutes: 90

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: | 
        python -m pip install --upgrade pip
      	  python -m pip install -r requirements.txt
      	
      - name: Install dbt packages
      	run: dbt deps
        # optionally use this parameter
        # to set a main directory of dbt project:
        # working-directory: ./my_dbt_project

      - name: Run the build
      	run: dbt build
      	# working-directory: ./my_dbt_project

      - name: Generate Docs
      	run: dbt docs generate
      	# working-directory: ./my_dbt_project
